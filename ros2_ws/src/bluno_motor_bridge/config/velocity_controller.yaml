encoder_velocity_controller:
  ros__parameters:
    # These schedules were identified at 6.75 V. Do not use them with the
    # nominal 5.6 V transformer; the 2026-09-24 recalibration showed a sharp
    # breakaway transition and requires a new closed-loop fit.
    control_rate_hz: 100.0
    reference_topics:
      ["/arm_1/encoder_velocity_reference", "/arm_2/encoder_velocity_reference"]
    encoder_signs: [1, -1]
    command_to_q_signs: [-1, -1]
    minimum_positions: [0.0, 0.0]
    maximum_positions: [300.0, 300.0]
    # Firmware enforces the hard [0, 300] bounds. A host guard of ten counts
    # prevented a controlled return from q<10 to the q=0 home.
    position_guard_counts: [0.0, 0.0]
    breakaway_pwm: [150.0, 122.0]
    running_pwm: [140.0, 105.0]
    # Conservative loaded-arm seed values at 5.6 V. PWM still approaches these
    # values through maximum_pwm_rate; refine the curves from the new logs.
    axis_0_contraction_positions: [0.0, 300.0]
    axis_0_contraction_breakaway_pwm: [150.0, 150.0]
    axis_0_contraction_running_pwm: [150.0, 150.0]
    axis_0_release_positions: [0.0, 300.0]
    axis_0_release_breakaway_pwm: [70.0, 70.0]
    axis_0_release_running_pwm: [40.0, 40.0]
    axis_1_contraction_positions: [0.0, 300.0]
    axis_1_contraction_breakaway_pwm: [100.0, 100.0]
    axis_1_contraction_running_pwm: [55.0, 55.0]
    axis_1_release_positions: [0.0, 300.0]
    axis_1_release_breakaway_pwm: [70.0, 70.0]
    axis_1_release_running_pwm: [40.0, 40.0]
    feedforward_pwm_per_count_s: [0.6, 0.6]
    proportional_gain: [0.4, 0.4]
    integral_gain: [0.15, 0.15]
    maximum_pwm: [200, 200]
    movement_velocity_threshold: [2.0, 2.0]
    movement_hold_s: [0.25, 0.25]
    # Limit PWM slew so breakaway is approached progressively rather than as
    # an instantaneous command. Refine per arm during the motion calibration.
    maximum_pwm_rate: [180.0, 180.0]
    maximum_pwm_fall_rate: [3000.0, 3000.0]
    velocity_filter_alpha: 0.35
    maximum_reference_age_s: 0.15
    maximum_telemetry_age_s: 0.10
    # Demo default: 20% more effort than the identified base schedules below.
    # Runtime UI choices can restore 1.0 or select -10/-20% as needed.
    initial_pwm_scale: 1.20
